<!-- Icono de VizFitness: baldosa naranja de marca con una mancuerna blanca
     y el pulso en oscuro. Mismo planteamiento que el icono de VizPlay
     (baldosa con degradado + glifo blanco), con el glifo de esta app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="viz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#E85D00"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#viz)"/>
  <g fill="#ffffff">
    <rect x="120" y="222" width="272" height="36" rx="18"/>
    <rect x="96" y="166" width="52" height="148" rx="18"/>
    <rect x="364" y="166" width="52" height="148" rx="18"/>
    <rect x="58" y="200" width="34" height="80" rx="14" opacity=".85"/>
    <rect x="420" y="200" width="34" height="80" rx="14" opacity=".85"/>
  </g>
  <path d="M120 378 q 40 -36 76 0 t 76 0 t 76 0" fill="none" stroke="#12100E" stroke-width="22" stroke-linecap="round" opacity=".8"/>
</svg>
